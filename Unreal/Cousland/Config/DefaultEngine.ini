[SystemSettings]
; The castle is thousands of instanced boxes: room for their ray tracing geometry
; (default 400 MB) and for Lumen's surface cache (default 4096).
r.RayTracing.ResidentGeometryMemoryPoolSizeInMB=1024
r.LumenScene.SurfaceCache.AtlasSize=8192
; MetaHuman hair: strands on, at full quality. 8 visibility samples per pixel (the most there is) and a
; full sample budget (default 0.75) keep thin beard and brow strands from breaking into dark speckles.
r.HairStrands.Enable=1
r.HairStrands.Strands=1
r.HairStrands.Cards=1
r.HairStrands.Visibility.MSAA.SamplePerPixel=8
r.HairStrands.Visibility.MSAA.MeanSamplePerPixel=1.0
; Strands thinner than a pixel are widened to this fraction of one when rasterised (default 0.5): at 1.0
; every strand covers at least a full pixel, so beards read as a volume instead of breaking into dots.
r.HairStrands.RasterizationScale=1.0
; Hair voxel volume (on by default, set explicitly): it gives strands their self-shadowing and
; light transmission; without it beards look flat and grey.
r.HairStrands.Voxelization=1
; Sharper and smoother hair self-shadows (deep opacity maps): resolution 2048 -> 4096 and
; super-sampled transmittance (default off), which removes speckled shadow noise inside the hair.
r.HairStrands.DeepShadow.Resolution=4096
r.HairStrands.DeepShadow.SuperSampling=1
; Ambient (sky and bounced) light on hair: the default ad-hoc integration left strands almost black
; wherever only the castle's ambient light reaches them (faces stayed lit); uniform integration keeps
; their colour (tested 2026-10-20 in Iona's and Landra's rooms).
r.HairStrands.SkyLighting.IntegrationType=1
; Hair is sub-pixel detail that TSR can shimmer on. Its flicker rejection is off at Low/Medium scalability;
; keep it on at every level, with Epic's recommended 3-frame period.
r.TSR.ShadingRejection.Flickering=1
r.TSR.ShadingRejection.Flickering.Period=3


; Unreal's local cache (Zen) on E:, not the nearly full C: (default %LOCALAPPDATA%\UnrealEngine\Common\Zen)
[Zen.AutoLaunch]
DataPath=E:/UnrealDDC/Zen/Data
